name = "zimo-mahjong"
main = "src/index.js"
compatibility_date = "2025-09-01"

# File website (HTML, CSS, gambar)
[assets]
directory = "./public"
binding = "ASSETS"

# Database D1. Buat dulu di dashboard Cloudflare (Storage & Databases > D1),
# lalu ganti database_id di bawah dengan ID database tersebut.
[[d1_databases]]
binding = "DB"
database_name = "zimo-db"
database_id = "3c56d69b-f5fc-4838-a63f-4c6c51b02636"
